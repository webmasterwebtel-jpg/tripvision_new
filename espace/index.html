<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f3b2e">
  <meta name="robots" content="noindex">
  <title>Mon espace TripVision</title>
  <link rel="icon" href="/assets/tripvision-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/backoffice/backoffice.css?v=16">
  <link rel="stylesheet" href="espace.css?v=11">
  <link rel="stylesheet" href="client.css?v=6">
</head>
<body>
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <img src="/assets/tripvision-icon.png?v=2" alt="" class="logo-mark">
        <div class="brand-text"><strong>TripVision</strong><small id="brandSub">Mon espace</small></div>
        <button id="collapseBtn" class="icon-btn collapse-btn" type="button" aria-label="Réduire le menu" title="Réduire le menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
        </button>
        <button id="menuBtn" class="icon-btn menu-btn" type="button" aria-label="Ouvrir le menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
      <nav id="nav" aria-label="Navigation principale"></nav>
      <div class="sidebar-foot">
        <a id="bellLink" class="icon-btn bell-btn" href="#notifications" data-badge="notifications" aria-label="Notifications" title="Notifications" hidden></a>
        <a class="site-link" href="/" target="_blank" rel="noopener" title="Retourner sur le site (nouvel onglet)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5 10v10h5v-6h4v6h5V10"/></svg><span>Retour au site</span></a>
        <div class="me">
          <div id="userMenu" class="user-menu" hidden></div>
          <span id="whoAvatar" class="avatar" aria-hidden="true"></span>
          <div class="me-text"><strong id="whoName"></strong><span id="whoRole" class="role-chip"></span></div>
          <button id="logoutBtn" class="icon-btn" type="button" aria-label="Se déconnecter" title="Se déconnecter">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <main id="view" class="workspace"></main>
  </div>

  <div id="boot" class="boot"><span class="spinner big" aria-hidden="true"></span><strong>Chargement de votre espace…</strong></div>
  <div id="progress" aria-hidden="true"></div>
  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/assets/pw-rules.js?v=1"></script>
  <script src="/assets/geo-picker.js?v=5"></script>
  <script src="/assets/vehicle-form.js?v=16"></script>
  <script src="/assets/responsive-tables.js?v=1"></script>
  <script src="espace.js?v=22"></script>
</body>
</html>
